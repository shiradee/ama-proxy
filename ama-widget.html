<!-- AMA WIDGET — paste before </body> in index.html -->
<!-- Replace YOUR_VERCEL_URL with your actual Vercel deployment URL e.g. https://ama-proxy.vercel.app -->

<style>
  .ama-trigger {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 500;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
  }

  .ama-bubble-hint {
    background: #1A1A1A;
    color: white;
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 2px;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(6px);
    transition: all 0.3s ease;
    pointer-events: none;
  }

  .ama-trigger:hover .ama-bubble-hint {
    opacity: 1;
    transform: translateY(0);
  }

  .ama-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #C4622D;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(196,98,45,0.35);
    transition: transform 0.2s, background 0.2s;
    flex-shrink: 0;
  }

  .ama-btn:hover { transform: scale(1.08); background: #A84E22; }

  .ama-btn svg { width: 22px; height: 22px; fill: white; }

  .ama-panel {
    position: fixed;
    bottom: 96px;
    right: 28px;
    width: 380px;
    height: 560px;
    z-index: 501;
    background: #FFFFFF;
    border: 1px solid #D9CEC5;
    border-radius: 4px;
    overflow: hidden;
    display: none;
    flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    animation: amaSlideIn 0.25s ease;
  }

  .ama-panel.open { display: flex; }

  @keyframes amaSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .ama-header {
    background: #1A1A1A;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .ama-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #C4622D;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: white;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }

  .ama-header-text { flex: 1; }

  .ama-name {
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #FFFFFF;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .ama-tagline {
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 1px;
  }

  .ama-close {
    background: none;
    border: none;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    padding: 0 0 2px;
    transition: color 0.15s;
  }

  .ama-close:hover { color: white; }

  .ama-status {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #C4622D;
    animation: amaPulse 2s infinite;
    flex-shrink: 0;
  }

  @keyframes amaPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .ama-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #FAF0E8;
  }

  .ama-msg {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    animation: amaMsgIn 0.25s ease;
  }

  @keyframes amaMsgIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .ama-msg.user { flex-direction: row-reverse; }

  .ama-msg-av {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 9px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .ama-msg-av.a { background: #C4622D; color: white; }
  .ama-msg-av.u { background: #1A1A1A; color: white; }

  .ama-msg-bubble {
    max-width: 82%;
    padding: 9px 12px;
    border-radius: 3px;
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 13px;
    line-height: 1.6;
    color: #1A1A1A;
  }

  .ama-msg.ama .ama-msg-bubble {
    background: #FFFFFF;
    border: 1px solid #D9CEC5;
    border-top-left-radius: 0;
  }

  .ama-msg.user .ama-msg-bubble {
    background: #1A1A1A;
    color: #FFFFFF;
    border-top-right-radius: 0;
  }

  .ama-typing {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 12px;
  }

  .ama-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #C4622D;
    animation: amaDot 1.2s infinite;
  }

  .ama-dot:nth-child(2) { animation-delay: 0.2s; }
  .ama-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes amaDot {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
    40% { transform: translateY(-4px); opacity: 1; }
  }

  .ama-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 14px;
    background: #F5EDE8;
    border-top: 1px solid #D9CEC5;
    flex-shrink: 0;
  }

  .ama-sug {
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 11px;
    padding: 5px 10px;
    border: 1px solid #C4622D;
    border-radius: 2px;
    background: transparent;
    color: #C4622D;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
  }

  .ama-sug:hover { background: #C4622D; color: white; }

  .ama-input-row {
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid #D9CEC5;
    background: #FFFFFF;
    flex-shrink: 0;
    align-items: flex-end;
  }

  .ama-input {
    flex: 1;
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 13px;
    padding: 8px 12px;
    border: 1px solid #D9CEC5;
    border-radius: 2px;
    background: #FAF0E8;
    color: #1A1A1A;
    resize: none;
    outline: none;
    line-height: 1.5;
    min-height: 36px;
    max-height: 80px;
    overflow-y: auto;
  }

  .ama-input:focus { border-color: #C4622D; }
  .ama-input::placeholder { color: #7A6A60; }

  .ama-send {
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 14px;
    background: #C4622D;
    color: white;
    border: none;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.15s;
    height: 36px;
    flex-shrink: 0;
  }

  .ama-send:hover { background: #A84E22; }
  .ama-send:disabled { opacity: 0.4; cursor: not-allowed; }

  @media (max-width: 480px) {
    .ama-panel { width: calc(100vw - 24px); right: 12px; bottom: 80px; }
    .ama-trigger { right: 16px; bottom: 16px; }
  }
</style>

<div class="ama-trigger">
  <div class="ama-bubble-hint">Ask me anything about Shira</div>
  <button class="ama-btn" id="ama-toggle" aria-label="Chat with Ama">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C6.477 2 2 6.145 2 11.243c0 2.906 1.378 5.504 3.546 7.238V22l3.677-2.121A11.3 11.3 0 0012 20.486c5.523 0 10-4.145 10-9.243S17.523 2 12 2zm1 13H7v-2h6v2zm4-4H7V9h10v2z"/>
    </svg>
  </button>
</div>

<div class="ama-panel" id="ama-panel" role="dialog" aria-label="Chat with Ama">
  <div class="ama-header">
    <div class="ama-avatar">AMA</div>
    <div class="ama-header-text">
      <div class="ama-name">Ama</div>
      <div class="ama-tagline">Ask me anything about Shira</div>
    </div>
    <div class="ama-status"></div>
    <button class="ama-close" id="ama-close" aria-label="Close chat">&times;</button>
  </div>

  <div class="ama-messages" id="ama-messages"></div>

  <div class="ama-suggestions" id="ama-suggestions">
    <button class="ama-sug" onclick="amaUseSug(this)">What makes Shira different?</button>
    <button class="ama-sug" onclick="amaUseSug(this)">Her Google work</button>
    <button class="ama-sug" onclick="amaUseSug(this)">What is agentic UX?</button>
    <button class="ama-sug" onclick="amaUseSug(this)">Is she available?</button>
  </div>

  <div class="ama-input-row">
    <textarea class="ama-input" id="ama-input" placeholder="Ask anything..." rows="1"></textarea>
    <button class="ama-send" id="ama-send" onclick="amaSend()">Send</button>
  </div>
</div>

<script>
(function() {
  const PROXY_URL = 'YOUR_VERCEL_URL/api/chat';
  let amaMessages = [];
  let amaLoading = false;

  const panel = document.getElementById('ama-panel');
  const toggle = document.getElementById('ama-toggle');
  const close = document.getElementById('ama-close');
  const messagesEl = document.getElementById('ama-messages');
  const inputEl = document.getElementById('ama-input');
  const sendBtn = document.getElementById('ama-send');
  const suggestionsEl = document.getElementById('ama-suggestions');

  toggle.addEventListener('click', () => {
    const isOpen = panel.classList.contains('open');
    panel.classList.toggle('open');
    if (!isOpen && amaMessages.length === 0) amaAddMsg('ama', "Hi, I'm Ama — I know everything about Shira Kates and I'm not shy about it. Ask me anything: her work, her thinking, her case studies, what she's looking for next. What do you want to know?");
  });

  close.addEventListener('click', () => panel.classList.remove('open'));

  function amaAddMsg(role, content, isTyping = false) {
    const div = document.createElement('div');
    div.className = `ama-msg ${role}`;

    const av = document.createElement('div');
    av.className = `ama-msg-av ${role === 'ama' ? 'a' : 'u'}`;
    av.textContent = role === 'ama' ? 'A' : 'You';

    const bubble = document.createElement('div');
    bubble.className = 'ama-msg-bubble' + (isTyping ? ' ama-typing' : '');

    if (isTyping) {
      bubble.innerHTML = '<div class="ama-dot"></div><div class="ama-dot"></div><div class="ama-dot"></div>';
    } else {
      bubble.innerHTML = content.replace(/\n/g, '<br>');
    }

    div.appendChild(av);
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  window.amaUseSug = function(btn) {
    inputEl.value = btn.textContent;
    suggestionsEl.style.display = 'none';
    amaSend();
  };

  window.amaSend = async function() {
    if (amaLoading) return;
    const text = inputEl.value.trim();
    if (!text) return;

    suggestionsEl.style.display = 'none';
    amaAddMsg('user', text);
    amaMessages.push({ role: 'user', content: text });
    inputEl.value = '';
    inputEl.style.height = 'auto';

    amaLoading = true;
    sendBtn.disabled = true;
    const typingEl = amaAddMsg('ama', '', true);

    try {
      const res = await fetch(PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: amaMessages })
      });

      const data = await res.json();
      const reply = data.content?.find(b => b.type === 'text')?.text || "Something went sideways on my end. Try again?";

      typingEl.remove();
      amaAddMsg('ama', reply);
      amaMessages.push({ role: 'assistant', content: reply });

    } catch (err) {
      typingEl.remove();
      amaAddMsg('ama', "Connection hiccup — try again in a moment.");
    }

    amaLoading = false;
    sendBtn.disabled = false;
    inputEl.focus();
  };

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); amaSend(); }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 80) + 'px';
  });
})();
</script>
<!-- END AMA WIDGET -->
